<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- The app's own graphite, lifted slightly at the top so the tile has depth on a dock. -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b313c"/>
      <stop offset="55%" stop-color="#1b1f27"/>
      <stop offset="100%" stop-color="#12151b"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8be74"/>
      <stop offset="55%" stop-color="#d3a24c"/>
      <stop offset="100%" stop-color="#a87c2c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d3a24c" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#d3a24c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="72" y="72" width="880" height="880" rx="198" fill="url(#tile)"/>
  <rect x="72" y="72" width="880" height="880" rx="198" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>

  <circle cx="404" cy="512" r="300" fill="url(#glow)"/>

  <!-- The aperture from the wordmark: a frame, and the voice inside it. -->
  <circle cx="404" cy="512" r="150" fill="none" stroke="url(#brass)" stroke-width="34"/>
  <circle cx="404" cy="512" r="52" fill="url(#brass)"/>

  <!-- Sound leaving the frame — silent picture, now a talkie. -->
  <g fill="none" stroke="url(#brass)" stroke-width="34" stroke-linecap="round">
    <path d="M602 404 a 150 150 0 0 1 0 216" opacity="0.95"/>
    <path d="M690 342 a 250 250 0 0 1 0 340" opacity="0.62"/>
    <path d="M778 280 a 350 350 0 0 1 0 464" opacity="0.32"/>
  </g>
</svg>
