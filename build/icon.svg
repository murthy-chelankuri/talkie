<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Record it silent. Give it a voice.

    The mark is that sentence: a flat line — a silent capture, nothing being said — breaking into
    speech. Read left to right it is the whole product in one gesture, and it is the app's own
    visual language, because the voice layer on the timeline draws narration as exactly these
    bars.

    Built to survive a dock at 32px, which is where the icon it replaces fell apart: that one put
    a ring off to the left with three arcs trailing away, the last two so faint they read as dirt
    rather than as sound. Nothing here fades, nothing is thinner than 30px at full size, and the
    whole mark is optically centred rather than drifting left.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b313c"/>
      <stop offset="55%" stop-color="#1b1f27"/>
      <stop offset="100%" stop-color="#12151b"/>
    </linearGradient>

    <!-- Azure, lit from the top left so the bars read as objects rather than as flat shapes. -->
    <linearGradient id="accent" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#b5d8f9"/>
      <stop offset="45%" stop-color="#7ab5f0"/>
      <stop offset="100%" stop-color="#3d7fc4"/>
    </linearGradient>

    <!-- The light a dock icon catches along its top edge. -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="72" y="72" width="880" height="880" rx="198" fill="url(#tile)"/>
  <rect x="72" y="72" width="880" height="880" rx="198" fill="url(#sheen)"/>
  <rect x="72" y="72" width="880" height="880" rx="198" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>

  <!--
    Four bars, not six. Six looked better at 1024 and merged into a lump at 32, because the gaps
    between them fell below a pixel. These are the widest bars and the widest gaps that still
    read as speech, which is the size that decides an icon.
  -->
  <g fill="url(#accent)">
    <!-- Silence: one line, held. Same weight as the bars, so it is the same voice. -->
    <rect x="206" y="486" width="232" height="52" rx="26"/>

    <!-- Then the voice. Uneven on purpose — speech is not a ramp. -->
    <rect x="478" y="437" width="52" height="150" rx="26"/>
    <rect x="570" y="332" width="52" height="360" rx="26"/>
    <rect x="662" y="407" width="52" height="210" rx="26"/>
    <rect x="754" y="367" width="52" height="290" rx="26"/>
  </g>
</svg>
