<!DOCTYPE html>
<html>
<head>
  <title>Recording Toolbar</title>
</head>
<body>
  <div id="setup">
    <input id="url-input" type="text" placeholder="https://..." style="width: 250px" />
    <button id="start">Start Recording</button>
  </div>
  <div id="controls" style="display: none">
    <button id="important">Important</button>
    <button id="redo">Redo</button>
    <button id="skip">Skip</button>
    <button id="stop">Stop</button>
  </div>
  <p id="error" style="color: red; display: none"></p>
  <script>
    const { ipcRenderer } = require('electron')
    const projectId = new URLSearchParams(window.location.search).get('projectId')
    const errorEl = document.getElementById('error')

    function showError(err) {
      errorEl.textContent = err instanceof Error ? err.message : String(err)
      errorEl.style.display = 'block'
    }

    document.getElementById('start').onclick = async () => {
      const url = document.getElementById('url-input').value
      try {
        errorEl.style.display = 'none'
        await ipcRenderer.invoke('project:capture:start', projectId, url)
        document.getElementById('setup').style.display = 'none'
        document.getElementById('controls').style.display = 'block'
      } catch (err) {
        showError(err)
      }
    }

    document.getElementById('important').onclick = () => ipcRenderer.invoke('project:capture:mark', 'important').catch(showError)
    document.getElementById('redo').onclick = () => ipcRenderer.invoke('project:capture:mark', 'redo').catch(showError)
    document.getElementById('skip').onclick = () => ipcRenderer.invoke('project:capture:mark', 'skip').catch(showError)

    document.getElementById('stop').onclick = async () => {
      try {
        await ipcRenderer.invoke('project:capture:stop')
        window.close()
      } catch (err) {
        showError(err)
      }
    }
  </script>
</body>
</html>
