<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /*
       * The page every scene was first drawn on, so each lands where it always did. Scenes size
       * their layers at 100% and pad them in percentages: without border-box the padding went
       * outside the frame, and a centred title sat 211 px right and 173 px down. The background
       * is the page colour scenes were designed against, which shows through while one fades in.
       */
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; overflow: hidden; }
      body { background-color: #1f2428; }
      #root { position: relative; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="page.js"></script>
  </body>
</html>
