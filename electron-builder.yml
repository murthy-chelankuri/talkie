appId: com.murthychelankuri.talkie
productName: Talkie
directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json
  # Apache-2.0 section 4(d) asks anyone redistributing this to carry the NOTICE with it, and
  # nobody can carry what was never in the bundle. The in-app Licences screen covers the
  # dependencies; these two are Talkie's own terms, and the GPL obligations that come with
  # shipping a build at all.
  - LICENSE
  - NOTICE
  # ONNX Runtime ships a build for every platform, ~35 MB each. Talkie runs on Apple Silicon only,
  # so the other five are left behind rather than shipped and never loaded.
  - '!node_modules/onnxruntime-node/bin/napi-v3/{linux,win32}/**'
  - '!node_modules/onnxruntime-node/bin/napi-v3/darwin/x64/**'

# Licence texts no package carries — the GPL for FFmpeg and eSpeak NG, and ONNX Runtime's notices.
# Installed at Contents/Resources/licences/, outside the archive, where a person can open them.
extraResources:
  - from: licences
    to: licences

# Native binaries cannot be loaded from inside an asar archive. Remotion's compositor carries the
# ffmpeg this app uses for transcoding, frame sampling and audio conversion; Playwright's driver
# is a node process it spawns. Both have to sit on the filesystem as real files.
asarUnpack:
  # The MCP server is spawned by an outside agent as a plain node process, which cannot read a
  # file inside an asar archive. It has to be a real file on disk for `node <path>` to work.
  - out/mcp/**
  - node_modules/@remotion/compositor-**/**
  - node_modules/playwright/**
  - node_modules/playwright-core/**
  # Importing a deck means rasterising a PDF, which the MCP server does itself rather than
  # asking a renderer it has not got. Same reason as above for pdfjs — plain node cannot read
  # it from inside the archive — and @napi-rs/canvas is a native module, which cannot load
  # from in there at all.
  - node_modules/pdfjs-dist/**
  - node_modules/@napi-rs/**
  # Drawing a diagram means reading mermaid's own files off disk and serving them to a headless
  # page, which cannot be done from inside the archive.
  - node_modules/mermaid/**
  # The composition is served to a headless page the same way, so it cannot live in the archive
  # either. Built by scripts/bundleRemotion.mjs — see remotionBundle.ts for why it is shipped
  # rather than made on demand.
  - out/remotion/**
  # Kokoro runs in a forked worker (out/main/kokoroWorker.cjs). ONNX Runtime is a native library,
  # which cannot load from inside the archive; kokoro-js reads its voice files off disk beside its
  # own code; and the rest are what those load. `sharp` is the stub in stubs/sharp — plain
  # JavaScript, so it stays in the archive. See kokoroWorker.ts and stubs/sharp/README.md.
  - node_modules/kokoro-js/**
  - node_modules/phonemizer/**
  - node_modules/@huggingface/**
  - node_modules/onnxruntime-node/**
  - node_modules/onnxruntime-common/**

mac:
  icon: build/icon.icns
  category: public.app-category.video
  target:
    - target: dmg
      arch: [arm64]
  # No Developer ID certificate exists yet, so the app is ad-hoc signed: it runs on the machine
  # that built it, and elsewhere macOS quarantines it until the user clears it. See README.
  identity: null
  hardenedRuntime: false
  extendInfo:
    # Recording narration in your own voice asks for the microphone. Without this key macOS
    # terminates the app at the moment it asks, rather than refusing politely.
    NSMicrophoneUsageDescription: Talkie records narration in your own voice when you ask it to.
    # Playwright drives a separate browser to capture a session.
    NSAppleEventsUsageDescription: Talkie controls a browser to record the session you are demonstrating.

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

npmRebuild: false
