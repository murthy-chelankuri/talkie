ie-diagram .node path{fill:#2d3138;stroke:#7ab5f0;stroke-width:1px;}#talkie-diagram .rough-node .label text,#talkie-diagram .node .label text,#talkie-diagram .image-shape .label,#talkie-diagram .icon-shape .label{text-anchor:middle;}#talkie-diagram .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#talkie-diagram .rough-node .label,#talkie-diagram .node .label,#talkie-diagram .image-shape .label,#talkie-diagram .icon-shape .label{text-align:center;}#talkie-diagram .node.clickable{cursor:pointer;}#talkie-diagram .root .anchor path{fill:#c9cedb!important;stroke-width:0;stroke:#c9cedb;}#talkie-diagram .arrowheadPath{fill:#e8e4dd;}#talkie-diagram .edgePaths .path{stroke:#c9cedb;stroke-width:1px;}#talkie-diagram .flowchart-link{stroke:#c9cedb;fill:none;}#talkie-diagram .edgeLabel{background-color:#3a3e44;text-align:center;}#talkie-diagram .edgeLabel p{background-color:#3a3e44;}#talkie-diagram .edgeLabel rect{opacity:0.5;background-color:#3a3e44;fill:#3a3e44;}#talkie-diagram .labelBkg{background-color:rgba(58, 62, 68, 0.5);}#talkie-diagram .cluster rect{fill:#22262d;stroke:hsl(218.1818181818, 0%, 5.4901960784%);stroke-width:1px;}#talkie-diagram .cluster text{fill:#ddd9d2;}#talkie-diagram .cluster span{color:#ddd9d2;}#talkie-diagram .node .collapsed-indicator{fill:hsl(218.1818181818, 0%, 5.4901960784%);stroke:none;opacity:0.6;}#talkie-diagram .node .collapsed-separator{stroke:hsl(218.1818181818, 0%, 5.4901960784%);stroke-width:0.75px;}#talkie-diagram div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:"Geist Variable",Geist Variable,ui-sans-serif,system-ui,sans-serif;font-size:12px;background:#22262d;border:1px solid hsl(218.1818181818, 0%, 5.4901960784%);border-radius:2px;pointer-events:none;z-index:100;}#talkie-diagram .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#f4f6f9;}#talkie-diagram rect.text{fill:none;stroke-width:0;}#talkie-diagram .icon-shape,#talkie-diagram .image-shape{background-color:#3a3e44;tex