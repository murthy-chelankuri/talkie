<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="talkie:template" content="Closing card — the logo large, the tagline and where to find them">
<meta name="talkie:category" content="Slides">
<script type="application/json" id="talkie-values">
{
  "title": ""
}
</script>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--talkie-bg); }
  main { position: absolute; inset: 0; padding: 0 11%; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 36px; text-align: center; }
  .plate { display: flex; align-items: center; justify-content: center; background: var(--talkie-logo-plate); border-radius: 36px; }
  .plate.on { padding: 0 54px; height: 194px; }
  .plate img { display: block; height: 194px; max-width: 960px; object-fit: contain; }
  .plate.on img { height: 140px; max-width: 770px; }
  h1 { margin: 0; font: 500 104px/1.08 var(--talkie-font-heading); color: var(--talkie-heading); }
  #tagline { margin: 0; font: 400 46px/1.3 var(--talkie-font-body); color: var(--talkie-body); }
  #website { font: 400 38px/1.2 var(--talkie-font-body); color: var(--talkie-accent); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main id="card"><div class="plate" id="plate"><img id="logo" alt=""></div><h1 id="title"></h1><p id="tagline"></p><span id="website"></span></main>
<script>
  // Values: title — left empty, the card leads with the theme's tagline. The logo, tagline and
  // website are the theme's, read live, so a project that changes theme changes its sign-off.
  const show = (id, text) => {
    const element = document.getElementById(id)
    element.textContent = text
    element.hidden = !text
  }
  const brand = (theme) => {
    const plate = document.getElementById('plate')
    plate.hidden = !theme?.logo
    if (theme?.logo) document.getElementById('logo').src = theme.logo
    plate.classList.toggle('on', Boolean(theme?.logoPlate))
    const written = String(talkie.params.title ?? '').trim()
    const title = written || theme?.tagline || theme?.company || 'Thanks for watching'
    show('title', title)
    // The tagline under a title of its own, never twice.
    show('tagline', theme?.tagline && theme.tagline !== title ? theme.tagline : '')
    show('website', theme?.website ?? '')
  }
  talkie.ready(talkie.initialised.then(() => brand(talkie.theme)))
  talkie.onTheme(brand)

  const ease = (x) => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3)
  talkie.onFrame((t) => {
    const k = ease(t / 0.45)
    const card = document.getElementById('card')
    card.style.opacity = 0.82 + 0.18 * k
    card.style.transform = `translateY(${(1 - k) * 12}px)`
  })
</script>
</body>
</html>
