<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="talkie:template" content="Kinetic title — the words rise in one at a time, then a rule draws under them">
<meta name="talkie:category" content="Motion">
<script type="application/json" id="talkie-values">
{
  "title": "Ship demos in minutes",
  "subtitle": "Recorded, narrated and exported by Talkie"
}
</script>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--talkie-bg); }
  main { position: absolute; left: 160px; right: 160px; top: 50%; transform: translateY(-50%); }
  h1 { margin: 0; font: 600 128px/1.05 var(--talkie-font-heading); color: var(--talkie-heading); }
  h1 span { display: inline-block; margin-right: 0.24em; opacity: 0; }
  .rule { height: 8px; width: 0; margin: 48px 0 40px; background: var(--talkie-accent); border-radius: 4px; }
  p { margin: 0; font: 400 48px/1.3 var(--talkie-font-body); color: var(--talkie-body); opacity: 0; }
</style>
</head>
<body>
<main><h1 id="title"></h1><div class="rule" id="rule"></div><p id="subtitle"></p></main>
<script>
  // Values: title, subtitle. Everything moves by talkie.time, so any frame can be drawn first.
  let words = []
  talkie.ready(talkie.initialised.then(() => {
    const title = talkie.params.title ?? 'Ship demos in minutes'
    document.getElementById('title').innerHTML = title.split(' ').map((w) => `<span>${w.replace(/</g, '&lt;')}</span>`).join('')
    document.getElementById('subtitle').textContent = talkie.params.subtitle ?? 'Recorded, narrated and exported by Talkie'
    words = Array.from(document.querySelectorAll('#title span'))
  }))

  const ease = (x) => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3)
  talkie.onFrame((t) => {
    words.forEach((word, i) => {
      const k = ease((t - 0.2 - i * 0.12) / 0.5)
      word.style.opacity = k
      word.style.transform = `translateY(${(1 - k) * 40}px)`
    })
    const after = 0.2 + words.length * 0.12 + 0.3
    document.getElementById('rule').style.width = `${ease((t - after) / 0.6) * 320}px`
    document.getElementById('subtitle').style.opacity = ease((t - after - 0.3) / 0.6)
  })
</script>
</body>
</html>
