<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="talkie:template" content="Quote — a customer's or expert's words, with who said them">
<meta name="talkie:category" content="Slides">
<script type="application/json" id="talkie-values">
{
  "quote": "We used to spend a day on every demo video. Now it takes ten minutes, and it stays up to date.",
  "name": "Priya Raman",
  "role": "Head of Product Marketing"
}
</script>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--talkie-bg); }
  main { position: absolute; left: 220px; right: 220px; top: 50%; transform: translateY(-50%); }
  .mark { font: 600 220px/0.6 var(--talkie-font-heading); color: var(--talkie-accent); opacity: 0; }
  blockquote { margin: 40px 0 0; font: 500 68px/1.3 var(--talkie-font-heading); color: var(--talkie-heading); opacity: 0; }
  .who { margin-top: 60px; display: flex; align-items: center; gap: 28px; opacity: 0; }
  .who .rule { width: 80px; height: 6px; border-radius: 3px; background: var(--talkie-accent); }
  .who b { font: 600 40px/1.2 var(--talkie-font-body); color: var(--talkie-heading); }
  .who span { display: block; margin-top: 6px; font: 400 32px/1.2 var(--talkie-font-body); color: var(--talkie-body); }
</style>
</head>
<body>
<main>
  <div class="mark" id="mark">“</div>
  <blockquote id="quote"></blockquote>
  <div class="who" id="who"><div class="rule"></div><div><b id="name"></b><span id="role"></span></div></div>
</main>
<script>
  // Values: quote, name, role. The words come in first and who said them after, on the last line
  // of narration where the take is timed.
  let attributionAt = 1.6
  talkie.ready(talkie.initialised.then(() => {
    document.getElementById('quote').textContent = talkie.params.quote ?? ''
    document.getElementById('name').textContent = talkie.params.name ?? ''
    document.getElementById('role').textContent = talkie.params.role ?? ''
    const beats = talkie.beats
    if (beats.length > 1) attributionAt = beats[beats.length - 1]
  }))

  const ease = (x) => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3)
  talkie.onFrame((t) => {
    document.getElementById('mark').style.opacity = ease(t / 0.4)
    const quote = document.getElementById('quote')
    quote.style.opacity = ease((t - 0.2) / 0.7)
    quote.style.transform = `translateY(${(1 - ease((t - 0.2) / 0.7)) * 24}px)`
    document.getElementById('who').style.opacity = ease((t - attributionAt) / 0.6)
  })
</script>
</body>
</html>
