<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="talkie:template" content="Lottie animation — an After Effects animation, recoloured to the theme, with a title">
<script src="__TALKIE_LIB__/lottie.min.js"></script>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--talkie-bg); }
  #stage { position: absolute; left: 460px; top: 120px; width: 1000px; height: 640px; }
  h1 { position: absolute; left: 0; right: 0; bottom: 140px; margin: 0; text-align: center; font: 600 72px/1.1 var(--talkie-font-heading); color: var(--talkie-heading); }
</style>
</head>
<body>
<div id="stage"></div>
<h1 id="title"></h1>
<!-- Replace this with your own Lottie JSON. It is inlined because a scene cannot fetch files. -->
<script type="application/json" id="animation">
{"v":"5.7.4","fr":30,"ip":0,"op":60,"w":1000,"h":640,"nm":"pulse","ddd":0,"assets":[],"layers":[{"ddd":0,"ind":1,"ty":4,"nm":"circle","sr":1,"ks":{"o":{"a":0,"k":100},"r":{"a":0,"k":0},"p":{"a":0,"k":[500,320,0]},"a":{"a":0,"k":[0,0,0]},"s":{"a":1,"k":[{"t":0,"s":[40,40,100],"i":{"x":[0.4],"y":[1]},"o":{"x":[0.6],"y":[0]}},{"t":30,"s":[100,100,100],"i":{"x":[0.4],"y":[1]},"o":{"x":[0.6],"y":[0]}},{"t":60,"s":[40,40,100]}]}},"ao":0,"shapes":[{"ty":"gr","it":[{"ty":"el","p":{"a":0,"k":[0,0]},"s":{"a":0,"k":[480,480]},"nm":"e"},{"ty":"fl","c":{"a":0,"k":[0.48,0.71,0.94,1]},"o":{"a":0,"k":100},"nm":"f"},{"ty":"tr","p":{"a":0,"k":[0,0]},"a":{"a":0,"k":[0,0]},"s":{"a":0,"k":[100,100]},"r":{"a":0,"k":0},"o":{"a":0,"k":100}}],"nm":"g"}],"ip":0,"op":60,"st":0,"bm":0}]}
</script>
<script>
  // Values: title, loop (true to repeat the animation for the whole scene).
  let animation = null
  let length = 0
  talkie.ready(talkie.initialised.then(() => {
    document.getElementById('title').textContent = talkie.params.title ?? 'Always in time with the narration'
    const data = JSON.parse(document.getElementById('animation').textContent)
    // Every fill in the theme's accent, so the animation belongs to the video it is in.
    const accent = talkie.theme?.accent ?? '#7ab5f0'
    const rgb = [1, 3, 5].map((i) => parseInt(accent.slice(i, i + 2), 16) / 255)
    const recolour = (node) => {
      if (Array.isArray(node)) return node.forEach(recolour)
      if (!node || typeof node !== 'object') return
      if (node.ty === 'fl' && node.c && node.c.a === 0) node.c.k = [...rgb, 1]
      Object.values(node).forEach(recolour)
    }
    recolour(data)
    animation = lottie.loadAnimation({ container: document.getElementById('stage'), renderer: 'svg', loop: false, autoplay: false, animationData: data })
    length = ((data.op - data.ip) / data.fr) * 1000
  }))
  talkie.onFrame((t) => {
    if (!animation) return
    const ms = t * 1000
    animation.goToAndStop(talkie.params.loop === false ? Math.min(ms, length - 1) : ms % length, false)
  })
</script>
</body>
</html>
