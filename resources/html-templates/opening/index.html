<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="talkie:template" content="Opening card — the logo large, who the video is from, and its title">
<meta name="talkie:category" content="Slides">
<script type="application/json" id="talkie-values">
{
  "title": "Meet the product"
}
</script>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--talkie-bg); }
  main { position: absolute; inset: 0; padding: 0 11%; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 36px; text-align: center; }
  .plate { display: flex; align-items: center; justify-content: center; background: var(--talkie-logo-plate); border-radius: 36px; }
  .plate.on { padding: 0 54px; height: 194px; }
  .plate img { display: block; height: 194px; max-width: 960px; object-fit: contain; }
  .plate.on img { height: 140px; max-width: 770px; }
  #company { font: 400 34px/1.2 var(--talkie-font-body); letter-spacing: 4px; text-transform: uppercase; color: var(--talkie-accent); }
  h1 { margin: 0; font: 500 104px/1.08 var(--talkie-font-heading); color: var(--talkie-heading); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main id="card"><div class="plate" id="plate"><img id="logo" alt=""></div><span id="company"></span><h1 id="title"></h1></main>
<script>
  // Values: title. The logo and the company are the theme's, read live, so a project that changes
  // theme changes who its opening card says the video is from.
  const brand = (theme) => {
    const logo = document.getElementById('logo')
    const plate = document.getElementById('plate')
    plate.hidden = !theme?.logo
    if (theme?.logo) logo.src = theme.logo
    plate.classList.toggle('on', Boolean(theme?.logoPlate))
    const company = document.getElementById('company')
    company.textContent = theme?.company ?? ''
    company.hidden = !theme?.company
  }
  talkie.ready(talkie.initialised.then(() => {
    document.getElementById('title').textContent = talkie.params.title ?? ''
    brand(talkie.theme)
  }))
  talkie.onTheme(brand)

  const ease = (x) => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3)
  talkie.onFrame((t) => {
    // Settles in rather than arriving from nothing: the first frame is what every thumbnail shows.
    const k = ease(t / 0.45)
    const card = document.getElementById('card')
    card.style.opacity = 0.82 + 0.18 * k
    card.style.transform = `translateY(${(1 - k) * 12}px)`
  })
</script>
</body>
</html>
